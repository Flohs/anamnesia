name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Formatting, vet and tests, against a real database. Without one, every
  # DB-backed test calls t.Skip and the job reports success having run 71
  # fewer tests than it appears to — a gate that cannot turn red. pgvector
  # rather than stock postgres: the schema declares vector columns, so
  # Migrate fails on an image without the extension.
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: anamnesia
          POSTGRES_PASSWORD: anamnesia-test
          POSTGRES_DB: anamnesia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anamnesia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ANAMNESIA_TEST_DATABASE_URL: postgres://anamnesia:anamnesia-test@127.0.0.1:5432/anamnesia?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -s -l .)
          if [ -n "$out" ]; then
            echo "These files are not gofmt'd:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      # The database is what stops the DB-backed tests skipping, and a
      # broken DSN would put them straight back to skipping while the job
      # stayed green. Fail if more than a couple skip: the real-embedder
      # test skips by design here, since CI holds no provider key.
      - name: fail if tests are skipping
        run: |
          skipped=$(go test ./... -count=1 -v 2>&1 | grep -c "^\s*--- SKIP" || true)
          echo "skipped: $skipped"
          if [ "$skipped" -gt 2 ]; then
            echo "$skipped tests skipped — the database is not reachable, so this job is green without having run them"
            go test ./... -count=1 -v 2>&1 | grep "^\s*--- SKIP" | head -20
            exit 1
          fi

      - name: build
        run: go build ./...

  # The console's own suite, and the check that the bundle the binary
  # embeds was actually rebuilt from it. Without the second one, a UI change
  # ships a binary serving the previous console and every check stays green.
  #
  # This runs in node:22-alpine rather than through setup-go's Node, because
  # that is the image `make ui-build` uses on a developer's machine, and the
  # staleness check only means anything if both produce the same bytes.
  console:
    runs-on: ubuntu-latest
    container: node:22-alpine
    steps:
      # checkout needs git, and git refuses a tree it thinks belongs to
      # someone else, which is every checkout inside a container.
      - run: apk add --no-cache git
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: install
        working-directory: ui
        run: npm ci

      - name: typecheck
        working-directory: ui
        run: npm run typecheck

      - name: lint
        working-directory: ui
        run: npm run lint

      - name: test
        working-directory: ui
        run: npm test

      - name: the committed bundle must match the source
        run: |
          set -eu
          npm --prefix ui run build
          if ! git diff --quiet --exit-code internal/ui/dist; then
            echo "::error::internal/ui/dist is stale. Run 'make ui-build' and commit the result."
            git --no-pager diff --stat internal/ui/dist
            exit 1
          fi

  # Bring the real thing up the way a user does, and let doctor decide
  # whether it worked. This is the check that would have caught the schema
  # shipping at a width the default embedder could not write.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: make build

      - name: setup, start and verify
        env:
          ANAMNESIA_HOME: ${{ runner.temp }}/anamnesia
        run: |
          set -euo pipefail
          ./bin/anamnesia setup --no-hooks --no-start
          ./bin/anamnesia install --config-dir "$ANAMNESIA_HOME/claude"
          ./bin/anamnesia start
          # --deep writes and reads back a memory, so a schema that cannot
          # hold an embedding fails here rather than in a user's session.
          ./bin/anamnesia doctor --config-dir "$ANAMNESIA_HOME/claude" --deep

      - name: re-running setup must not duplicate hooks
        env:
          ANAMNESIA_HOME: ${{ runner.temp }}/anamnesia
        run: |
          set -euo pipefail
          ./bin/anamnesia install --config-dir "$ANAMNESIA_HOME/claude"
          ./bin/anamnesia install --config-dir "$ANAMNESIA_HOME/claude"
          ./bin/anamnesia doctor --config-dir "$ANAMNESIA_HOME/claude"

      - name: update must be a no-op on a current install
        env:
          ANAMNESIA_HOME: ${{ runner.temp }}/anamnesia
        run: |
          set -euo pipefail
          ./bin/anamnesia update --no-pull --no-hooks
          ./bin/anamnesia doctor --config-dir "$ANAMNESIA_HOME/claude"

      - name: server log on failure
        if: failure()
        env:
          ANAMNESIA_HOME: ${{ runner.temp }}/anamnesia
        run: cat "$ANAMNESIA_HOME/server.log" || true

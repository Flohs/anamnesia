name: anamnesia-os

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: anamnesia
      POSTGRES_PASSWORD: anamnesia
      POSTGRES_DB: anamnesia
    ports:
      # Host-side port can be overridden via ANAMNESIA_POSTGRES_PORT
      # in .env if you already have something on 5434.
      - "127.0.0.1:${ANAMNESIA_POSTGRES_PORT:-5434}:5432"
    volumes:
      - anamnesia-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "anamnesia", "-d", "anamnesia"]
      interval: 5s
      timeout: 5s
      retries: 10

  anamnesia:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      # Lets the container reach the host (where Ollama listens). Docker
      # Desktop on macOS / Windows resolves host.docker.internal already;
      # this line makes the same work on Linux engines.
      - "host.docker.internal:host-gateway"
    environment:
      ANAMNESIA_DATABASE_URL: postgres://anamnesia:anamnesia@postgres:5432/anamnesia?sslmode=disable
      ANAMNESIA_HTTP_ADDR: ":8181"
      ANAMNESIA_DEFAULT_USER: ${ANAMNESIA_DEFAULT_USER:-default}
      ANAMNESIA_DEFAULT_PROJECT: ${ANAMNESIA_DEFAULT_PROJECT:-}
      ANAMNESIA_SERVER_TOKEN: ${ANAMNESIA_SERVER_TOKEN:-}
      # Provider + model defaults intentionally omitted here so unset
      # values stay unset inside the container, letting the Go config
      # apply its provider/model defaults (including OpenRouter
      # auto-light-up when OPENROUTER_API_KEY is set).
      ANAMNESIA_EMBED_PROVIDER: ${ANAMNESIA_EMBED_PROVIDER:-}
      ANAMNESIA_EMBED_MODEL: ${ANAMNESIA_EMBED_MODEL:-}
      ANAMNESIA_EMBED_DIMS: ${ANAMNESIA_EMBED_DIMS:-1536}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      ANAMNESIA_LLM_PROVIDER: ${ANAMNESIA_LLM_PROVIDER:-}
      ANAMNESIA_LLM_MODEL: ${ANAMNESIA_LLM_MODEL:-}
      ANAMNESIA_LLM_HTTP_TIMEOUT: ${ANAMNESIA_LLM_HTTP_TIMEOUT:-120s}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANAMNESIA_RERANK_PROVIDER: ${ANAMNESIA_RERANK_PROVIDER:-}
      ANAMNESIA_RERANK_MODEL: ${ANAMNESIA_RERANK_MODEL:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANAMNESIA_PII_PROVIDER: ${ANAMNESIA_PII_PROVIDER:-regex}
      ANAMNESIA_PII_MODE: ${ANAMNESIA_PII_MODE:-tag}
      ANAMNESIA_PRESIDIO_URL: ${ANAMNESIA_PRESIDIO_URL:-}
      ANAMNESIA_DECAY_EVERY: ${ANAMNESIA_DECAY_EVERY:-1h}
      ANAMNESIA_CONSOLIDATE_EVERY: ${ANAMNESIA_CONSOLIDATE_EVERY:-24h}
      ANAMNESIA_FORGET_EVERY: ${ANAMNESIA_FORGET_EVERY:-1h}
      ANAMNESIA_EMBED_BACKFILL: ${ANAMNESIA_EMBED_BACKFILL:-1m}
      ANAMNESIA_EXTRACT_EVERY: ${ANAMNESIA_EXTRACT_EVERY:-15s}
      ANAMNESIA_EXTRACT_COMMITMENTS: ${ANAMNESIA_EXTRACT_COMMITMENTS:-}
    ports:
      # Override via ANAMNESIA_HTTP_PORT in .env if 8181 collides.
      - "127.0.0.1:${ANAMNESIA_HTTP_PORT:-8181}:8181"
    command: ["serve"]

volumes:
  anamnesia-postgres:
